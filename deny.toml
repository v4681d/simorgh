# cargo-deny configuration — run `cargo deny check` in CI.
[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

# SPDX expression (not a bare license id) → allow per-crate via exceptions.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "target-lexicon"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# gtk-rs GTK3 bindings (forced by tauri's webkit2gtk-4.1 backend) are flagged
# unmaintained; not vulnerabilities. Real CVEs still fail.
unmaintained = "none"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
