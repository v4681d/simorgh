[package]
name = "simorgh-engines-tts"
description = "Text-to-speech engines: Piper/Kokoro local, OpenAI-compatible, ElevenLabs"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Kokoro via ONNX Runtime.
kokoro = ["dep:ort", "dep:ndarray"]

[dependencies]
simorgh-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
keyring.workspace = true
directories.workspace = true
ort = { version = "2.0.0-rc.4", optional = true, default-features = false }
ndarray = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
