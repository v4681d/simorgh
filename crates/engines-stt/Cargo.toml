[package]
name = "simorgh-engines-stt"
description = "Speech-to-text engines: whisper.cpp local, OpenAI-compatible, Deepgram, custom endpoints"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Local whisper.cpp via whisper-rs; GPU acceleration via sub-features.
whisper = ["dep:whisper-rs"]
cuda = ["whisper", "whisper-rs/cuda"]
metal = ["whisper", "whisper-rs/metal"]
vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
simorgh-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true
keyring.workspace = true
directories.workspace = true
whisper-rs = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
