[package]
name = "simorgh-engines-mt"
description = "Translation engines: OpenAI-compatible, DeepL, Google, local servers, NLLB"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Bundled NLLB via ONNX Runtime (optional, large).
nllb = ["dep:ort", "dep:ndarray"]

[dependencies]
simorgh-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
keyring.workspace = true
ort = { version = "2.0.0-rc.4", optional = true, default-features = false }
ndarray = { version = "0.15", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
