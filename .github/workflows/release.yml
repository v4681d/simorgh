name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header

  bundle:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04     # AppImage only — portable, bundles deps
            args: --features whisper --bundles appimage
          - os: windows-latest    # MSI, NSIS
            args: --features whisper
          - os: macos-latest      # DMG (universal)
            args: --target universal-apple-darwin --features whisper
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf cmake
      - run: npm ci --prefix ui
      - name: Build and bundle (draft release)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # whisper.cpp's ggml uses std::filesystem, which needs macOS >= 10.15.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: "Simorgh ${{ github.ref_name }}"
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

  checksums:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --dir assets
          (cd assets && sha256sum * > ../SHA256SUMS.txt)
          gh release upload ${{ github.ref_name }} SHA256SUMS.txt --repo ${{ github.repository }}
