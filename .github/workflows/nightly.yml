name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            args: --features whisper --bundles appimage
          - os: windows-latest
            args: --features whisper
          - os: macos-latest
            args: --features whisper
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf cmake
      - run: npm ci --prefix ui
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # whisper.cpp's ggml uses std::filesystem, which needs macOS >= 10.15.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          projectPath: crates/app
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: simorgh-nightly-${{ matrix.os }}
          path: |
            target/release/bundle/**/*
          retention-days: 7
