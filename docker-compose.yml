# Local engine stack for Simorgh.
#
#   docker compose up -d
#   docker compose exec translation ollama pull qwen2.5:7b
#
# Then in Simorgh: Engines → Translation → API → OpenAI-compatible,
# base URL http://localhost:11434/v1, model qwen2.5:7b (no key needed).
services:
  translation:
    build:
      context: docker
      dockerfile: Dockerfile.engines
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
